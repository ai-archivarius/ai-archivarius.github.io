<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f3f5">
<title>AI-архіваріус</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Світ: стиль BRAINDUO. Світло-сірий фон із розмитими плямами, «скляні» картки, градієнт помаранчевий → рожевий → фіолетовий. */
  /* Layout: привітання й статистика → пошук → прибирання → «Скоро» → альбоми-плитки → усі скриншоти; окремі екрани для альбому, нагадувань і прибирання. */
  --bg:#f3f3f5;
  --glass:rgba(255,255,255,.64);
  --ink:#1c1c21;
  --ink2:#8d8d95;
  --line:rgba(28,28,33,.07);
  --orange:#f2a066;
  --pink:#e2639f;
  --purple:#b47ae8;
  --grey:#e7e7ea;
  --btn:#8e8e93;
  --grad:linear-gradient(90deg,#f2a066,#e2639f 55%,#b47ae8);
  --hl:rgba(242,160,102,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:
  radial-gradient(38% 30% at 12% 8%,rgba(180,122,232,.32),transparent 70%),
  radial-gradient(34% 28% at 95% 22%,rgba(242,160,102,.34),transparent 70%),
  radial-gradient(40% 30% at 70% 70%,rgba(226,99,159,.18),transparent 70%),
  radial-gradient(36% 26% at 5% 85%,rgba(242,160,102,.2),transparent 70%);filter:blur(10px)}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:10px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(60,40,90,.07)}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 0 calc(36px + env(safe-area-inset-bottom))}
.view[hidden],[hidden]{display:none!important}

.top{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 0;font-size:14px;color:var(--ink2)}
.top b{font-weight:600;color:var(--ink)}
.hello{font-family:var(--font-d);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:20px 20px 0}
.hello span{display:block;color:var(--ink2);font-weight:500;font-size:19px;letter-spacing:-.01em;margin-top:4px}
.bar{display:flex;gap:3px;margin:14px 20px 0;max-width:200px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--grey)}
.bar i.on{background:var(--grad);background-size:2000% 100%}
.stats{display:flex;gap:26px;margin:14px 20px 0}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:19px;font-weight:600}
.stats span{font-size:12.5px;color:var(--ink2)}

.search{position:sticky;top:0;z-index:10;padding:16px 20px 10px}
.search.stuck{background:rgba(243,243,245,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.field{display:flex;align-items:center;gap:10px;height:52px;border-radius:26px;padding:0 16px;color:var(--ink2)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%;font-size:17px;color:var(--ink)}
.field input::placeholder{color:var(--ink2)}
.field input::-webkit-search-cancel-button{display:none}
.clear{width:24px;height:24px;border-radius:50%;background:var(--grey);color:var(--ink2);display:grid;place-items:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:18px;font-size:14.5px;white-space:nowrap;display:flex;align-items:center}

.sec{display:flex;justify-content:space-between;align-items:baseline;padding:28px 20px 10px}
.sec h2{font-family:var(--font-d);font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
.sec button,.sec span{font-size:14.5px;color:var(--ink2)}

.list{margin:0 16px;border-radius:24px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;width:100%;padding:11px 16px}
.item + .item{border-top:1px solid var(--line)}
.item img{width:40px;height:58px;object-fit:cover;object-position:top;border-radius:10px;flex:none;background:var(--grey)}
.item .tx{flex:1;min-width:0}
.item .t1{display:block;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.item .t2.warm{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.chev{color:var(--ink2);opacity:.5;flex:none}

.tidy{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 16px;border-radius:24px;width:calc(100% - 32px);font-size:15px}
.tidy .ic{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tidy .tx{flex:1}
.tidy b{font-weight:600}
.tidy small{display:block;color:var(--ink2);font-size:13.5px;margin-top:1px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.tile{position:relative;overflow:hidden;height:132px;border-radius:26px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.tile.wide{grid-column:1/-1;height:104px}
.blob{position:absolute;width:110px;height:110px;border-radius:50%;top:-16px;right:-6px;filter:blur(20px);opacity:.75}
.tile .cnt{position:absolute;top:12px;left:14px;font-size:13px;color:var(--ink2)}
.tile .lab{display:flex;align-items:center;gap:8px;font-size:14.5px;position:relative}
.tile .ic{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}

.day{display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 8px}
.day b{font-size:16px;font-weight:600}
.day span{font-size:13.5px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.th{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--grey);display:block;width:100%;border-radius:16px;box-shadow:0 4px 14px rgba(60,40,90,.08)}
.th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.th .tag{position:absolute;left:6px;bottom:6px;font-size:11.5px;font-weight:600;border-radius:10px;padding:3px 8px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;gap:5px}
.th .tag i{width:7px;height:7px;border-radius:50%;background:var(--grad)}
.th.noise img{opacity:.4;filter:grayscale(1)}
.th.noise .tag i{background:var(--btn)}

.meta{padding:10px 20px 8px;font-size:14px;color:var(--ink2)}
.rwrap{margin:0 16px;border-radius:24px;overflow:hidden}
.res{display:flex;gap:14px;width:100%;padding:13px 16px;align-items:flex-start}
.res + .res{border-top:1px solid var(--line)}
.res img{width:56px;height:84px;object-fit:cover;object-position:top;border-radius:12px;flex:none;background:var(--grey)}
.res .rt{display:block;font-size:16.5px;font-weight:600;line-height:1.3}
.res .rs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--ink2);line-height:1.4;margin-top:3px}
.res .rm{display:block;font-size:13px;color:var(--ink2);margin-top:5px}
.res .rm b{color:var(--pink);font-weight:600}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 2px}
.empty{text-align:center;padding:40px 24px;color:var(--ink2);font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}

.back{display:flex;align-items:center;gap:8px;font-size:16px;padding:10px 20px 0;height:48px}
.back span.c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.h1{font-family:var(--font-d);font-size:28px;font-weight:600;letter-spacing:-.02em;margin:12px 20px 4px}
.lead{margin:0 20px;color:var(--ink2);font-size:15px;line-height:1.45}
.group{padding:22px 20px 8px;font-size:13.5px;color:var(--ink2)}
.pick{width:22px;height:22px;border-radius:50%;border:1.5px solid #cfcfd4;flex:none;display:grid;place-items:center;color:#fff}
.pick.on{background:var(--grad);border-color:transparent}
.btn{display:block;width:calc(100% - 40px);margin:22px 20px 0;height:52px;border-radius:26px;background:var(--btn);color:#fff;font-weight:600;font-size:16.5px;text-align:center}
.btn:not([disabled]){background:var(--grad)}
.btn[disabled]{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;border-radius:22px;padding:12px 18px;font-size:15px;display:flex;gap:16px;align-items:center;white-space:nowrap}
.toast button{font-weight:600;color:var(--pink)}

.viewer{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.viewer::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 30% at 85% 10%,rgba(242,160,102,.35),transparent 70%),radial-gradient(40% 30% at 10% 60%,rgba(180,122,232,.28),transparent 70%);filter:blur(10px)}
.vbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.vbar button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.vbar span{font-size:13.5px;color:var(--ink2);padding:8px 14px;border-radius:20px}
.vimg{position:relative;display:flex;justify-content:center;padding:4px 22px 0;touch-action:pan-y}
.vimg img{max-width:100%;max-height:64vh;border-radius:22px;display:block;box-shadow:0 18px 40px rgba(60,40,90,.18);background:#fff;min-height:200px;min-width:120px}
.vnav{position:relative;display:flex;justify-content:center;gap:16px;padding:16px 0 0}
.vnav button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.vnav button[disabled]{opacity:.35}
.info{position:relative;max-width:520px;margin:16px 16px 0;border-radius:28px;padding:20px 20px 22px}
@media (min-width:552px){.info{margin:16px auto 0}}
.info h3{font-family:var(--font-d);font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.25;margin:0}
.info .when{font-size:13.5px;color:var(--ink2);margin-top:4px}
.remind{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:#fff;font-size:15px}
.remind .dot{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.remind b{font-weight:600}
.kv{margin-top:14px}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{text-align:right;font-weight:500}
.ocrt{margin-top:12px;font-size:14.5px;color:var(--purple);font-weight:500}
.ocr{margin-top:8px;font-size:14px;line-height:1.5;color:var(--ink2)}
.note{margin-top:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.7);font-size:14.5px;color:var(--ink2)}
.pad{height:30px}
</style>
</head>
<body>
<div class="app">

  <section class="view" id="v-home">
    <div class="top"><b>AI-архіваріус</b><span id="count"></span></div>

    <div class="bar" id="pbar" aria-hidden="true"></div>
    <div class="stats" id="stats"></div>
    <div class="search" id="sbar">
      <label class="field glass" for="q">
        <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.8 10.8 15 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Опишіть своїми словами" autocomplete="off" enterkeyhint="search" aria-label="Пошук скриншотів">
        <button type="button" class="clear" id="clear" aria-label="Очистити" hidden><svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 1l6 6M7 1 1 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </label>
    </div>
    <div class="chips" id="sugg" aria-label="Приклади запитів"></div>

    <div id="home">
      <div id="tidy"></div>
      <div class="sec"><h2>Скоро</h2><button type="button" id="allrem">Усі нагадування</button></div>
      <div class="list glass" id="soon"></div>
      <div class="sec"><h2>Альбоми</h2><span>створюються самі</span></div>
      <div class="tiles" id="albums"></div>
      <div class="sec" style="padding-bottom:0"><h2>Усі скриншоти</h2><span id="allcount"></span></div>
      <div id="gallery"></div>
    </div>

    <div id="results" hidden>
      <div class="meta" id="rmeta"></div>
      <div class="rwrap glass" id="rlist"></div>
    </div>
  </section>

  <section class="view" id="v-album" hidden>
    <button type="button" class="back" data-back><span class="c glass"><svg width="9" height="15" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Назад</button>
    <h1 class="h1" id="atitle"></h1>
    <p class="lead" id="asub"></p>
    <div id="agrid"></div>
  </section>

  <section class="view" id="v-rem" hidden>
    <button type="button" class="back" data-back><span class="c glass"><svg width="9" height="15" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Назад</button>
    <h1 class="h1">Нагадування</h1>
    <p class="lead">Дати з квитків, бронювань і нотаток. Архіваріус знайшов їх сам.</p>
    <div id="remlist"></div>
  </section>

  <section class="view" id="v-tidy" hidden>
    <button type="button" class="back" data-back><span class="c glass"><svg width="9" height="15" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Назад</button>
    <h1 class="h1">Прибирання</h1>
    <p class="lead">Раз на тиждень тут збирається те, що вже не знадобиться. Перегляньте й приберіть одним натиском.</p>
    <div id="tidylist"></div>
    <button type="button" class="btn" id="tidydo"></button>
  </section>
</div>

<div class="toast glass" id="toast" hidden role="status"><span id="toast-t"></span><button type="button" id="toast-u">Повернути</button></div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vt">
  <div class="vbar"><button type="button" class="glass" id="vclose" aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><span class="glass" id="vpos"></span></div>
  <div class="vimg" id="vimgw"><img id="vimg" alt=""></div>
  <div class="vnav">
    <button type="button" class="glass" id="vprev" aria-label="Попередній"><svg width="10" height="16" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="glass" id="vnext" aria-label="Наступний"><svg width="10" height="16" viewBox="0 0 12 20"><path d="M2 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="info glass" id="vinfo"></div><div class="pad"></div>
</div>

    if (q.length === 4) return d.startsWith(q) || (d.slice(0,3) === q.slice(0,3) && Math.abs(d.length - q.length) <= 1);
    return d.startsWith(q) && (q.length >= 3 || d.length <= 3);
  }
  const FIELDS = [['title',3],['tags',2.5],['type',2.5],['keys',1.5],['text',1]];
  DATA.forEach(d => { d.f = {title:toks(d.title), tags:toks(d.tags), type:toks(d.type), keys:toks((d.keys||[]).map(k=>k.join(' ')).join(' ')), text:toks(d.text)}; });

  function parse(q){
    const groups = [], date = {};
    toks(q).forEach(t => {
      if (t === 'сьогодні') { date.day = 0; return; }
      if (t === 'вчора') { date.day = -1; return; }
      if (t === 'завтра') { date.day = 1; return; }
      if (/^тижн|^тижд/.test(t)) { date.week = true; return; }
      const m = MFORMS.findIndex(f => f.includes(t)); if (m >= 0) { date.month = m; return; }
      if (STOP.has(t)) return;
      const w = [[t,1]];
      if (SYN_EXACT[t]) SYN_EXACT[t].forEach(x => w.push([x,.8]));
      Object.keys(SYN).forEach(k => { if (t.startsWith(k)) SYN[k].forEach(x => w.push([norm(x),.8])); });
      groups.push(w);
    });
    return {groups, date, hasDate: Object.keys(date).length > 0};
  }
  function dateOk(d, date){
    const c = [d.sd]; if (d.ed) c.push(d.ed);
    if ('day' in date) return c.some(x => dd(NOW, x) === date.day);
    if (date.week) return c.some(x => Math.abs(dd(NOW, x)) <= 7);
    if ('month' in date) return (d.ed && d.ed.getMonth() === date.month) || d.sd.getMonth() === date.month;
    return true;
  }
  function search(q){
    const P = parse(q), out = [];
    DATA.forEach(d => {
      if (d.noise || removed.has(d.id)) return;
      if (P.hasDate && !dateOk(d, P.date)) return;
      if (!P.groups.length && !P.hasDate) return;
      let score = 0, hit = 0;
      P.groups.forEach(g => { let b = 0; FIELDS.forEach(([f,w]) => g.forEach(([x,k]) => { if (b < w*k && d.f[f].some(t => tm(x,t))) b = w*k; })); if (b){ hit++; score += b; } });
      if (hit < (P.groups.length ? Math.max(1, Math.ceil(P.groups.length*.6)) : 0)) return;
      out.push({d, s: score + hit*2});
    });
    out.sort((a,b) => b.s - a.s || ((b.d.ed && b.d.ed >= NOW) - (a.d.ed && a.d.ed >= NOW)) || b.d.sd - a.d.sd);
    return {list: out.map(o => o.d), P};
  }
  function hl(text, P, max){
    const words = (text||'').split(/(\s+)/), all = P.groups.flat().map(w => w[0]);
    const hit = w => { const n = norm(w); return n && all.some(q => n.split(' ').some(t => tm(q,t))); };
    let first = -1;
    const parts = words.map((w,i) => { if (!w || /^\s+$/.test(w)) return esc(w); if (hit(w)){ if (first < 0) first = i; return '<mark>'+esc(w)+'</mark>'; } return esc(w); });
    if (!max) return parts.join('');
    const st = Math.max(0, (first < 0 ? 0 : first) - 8);
    return (st > 0 ? '…' : '') + parts.slice(st, st + max*2).join('') + (st + max*2 < parts.length ? '…' : '');
  }



  const removed = new Set();
  const live = () => DATA.filter(d => !removed.has(d.id));
  const isPast = d => d.ed && d.ed < NOW && !(dd(NOW,d.ed) === 0 && allDay(d.ed));
  const upcoming = () => live().filter(d => d.ed && !isPast(d)).sort((a,b) => a.ed - b.ed);
  const isPromo = d => /промокод|акція/i.test(d.type) || /промокод/.test(d.tags);
  const T = id => id+'-t.jpg';
  const IMG = id => '<img loading="lazy" decoding="async" data-id="'+id+'" src="'+T(id)+'" alt="">';
  const chev = '<svg class="chev" width="7" height="12" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* навігація між екранами */
  let stack = [];
  function show(v){ ['home','album','rem','tidy'].forEach(x => $('v-'+x).hidden = x !== v); window.scrollTo(0,0); }
  function push(v){ stack.push(v); show(v); }
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => { stack.pop(); show(stack[stack.length-1] || 'home'); }));

  /* підказки */
  const SUGG = ['квиток на потяг','що купити','промокод','дедлайни','рецепт з гарбузом','пароль від вайфаю','квитки в грудні','що я зберегла сьогодні'];
  $('sugg').innerHTML = SUGG.map(s => '<button type="button" class="chip glass" data-q="'+esc(s)+'">'+esc(s)+'</button>').join('');
  $('sugg').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (!b) return; $('q').value = b.dataset.q; run(); });

  /* «Скоро» */
  function itemRow(d, sub, warm){ return '<button type="button" class="item" data-id="'+d.id+'">'+IMG(d.id)+'<span class="tx"><span class="t1">'+esc(d.title)+'</span><span class="t2'+(warm?' warm':'')+'">'+esc(sub)+'</span></span>'+chev+'</button>'; }
  function renderSoon(){
    const up = upcoming().slice(0, 3);
    $('soon').innerHTML = up.map(d => itemRow(d, rel(d.ed), dd(NOW,d.ed) <= 1)).join('');
  }
  $('soon').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openV(b.dataset.id, upcoming()); });
  $('allrem').addEventListener('click', () => { renderRem(); push('rem'); });
  function renderRem(){
    const up = upcoming(), S = [['Сьогодні',d=>dd(NOW,d.ed)===0],['Завтра',d=>dd(NOW,d.ed)===1],['Цього тижня',d=>{const k=dd(NOW,d.ed);return k>1&&k<=7;}],['Пізніше',d=>dd(NOW,d.ed)>7]];
    $('remlist').innerHTML = S.map(([n,f]) => { const L = up.filter(f); if (!L.length) return '';
      return '<div class="group">'+n+'</div><div class="list glass">'+L.map(d => itemRow(d, (dd(NOW,d.ed)>1 ? DW[d.ed.getDay()]+', '+dm(d.ed) : rel(d.ed)) + (dd(NOW,d.ed)>1 && !allDay(d.ed) ? ' о '+hm(d.ed) : ''), dd(NOW,d.ed) <= 1)).join('')+'</div>'; }).join('');
  }
  $('remlist').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openV(b.dataset.id, upcoming()); });

  /* альбоми */
  const ALBUMS = [
    ['Квитки й поїздки', d => d.cat === 'tickets'],
    ['Навчання', d => d.cat === 'study'],
    ['Промокоди', d => isPromo(d)],
    ['Рецепти', d => d.cat === 'recipes'],
    ['Покупки', d => (d.cat === 'shopping' || d.cat === 'finance') && !isPromo(d)],
    ['Місця', d => d.cat === 'places'],
    ['Ідеї', d => d.cat === 'tips'],
    ['Нотатки й паролі', d => d.cat === 'notes']
  ];
  const albumItems = i => live().filter(d => !d.noise && ALBUMS[i][1](d));
  const BLOBS = ['#f2a066','#b47ae8','#e2639f','#f2a066','#b47ae8','#e2639f','#f2a066','#b47ae8'];
  const ICONS = ['✈︎','✎','%','♨︎','◎','⌖','✦','✱'];
  function renderAlbums(){
    const list = ALBUMS.map((a,i) => [a,i,albumItems(i)]).filter(x => x[2].length);
    $('albums').innerHTML = list.map(([a,i,it], n) => '<button type="button" class="tile glass'+(n === list.length-1 && list.length % 2 ? ' wide' : '')+'" data-a="'+i+'"><span class="blob" style="background:radial-gradient(circle,'+BLOBS[i]+','+BLOBS[(i+1)%BLOBS.length]+' 70%)"></span><span class="cnt">'+it.length+'</span><span class="lab"><span class="ic">'+ICONS[i]+'</span>'+a[0]+'</span></button>').join('');
  }
  let actx = [], curA = null;
  function fillAlbum(i){ curA = i; actx = albumItems(i); $('atitle').textContent = ALBUMS[i][0]; $('asub').textContent = actx.length+' '+pl(actx.length,'скриншот','скриншоти','скриншотів')+'. Альбом поповнюється сам.'; $('agrid').innerHTML = groups(actx); }
  $('albums').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; fillAlbum(+b.dataset.a); push('album'); });
  $('agrid').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openV(b.dataset.id, actx); });

  /* галерея */
  function thumb(d){
    let tag = '';
    if (d.noise) tag = '<span class="tag"><i></i>шум</span>';
    else if (d.ed && !isPast(d) && dd(NOW, d.ed) < 8) tag = '<span class="tag"><i></i>'+esc(rel(d.ed))+'</span>';
    return '<button type="button" class="th'+(d.noise?' noise':'')+'" data-id="'+d.id+'" aria-label="'+esc(d.title)+'">'+IMG(d.id)+''+tag+'</button>';
  }
  function groups(list){
    const G = [];
    list.forEach(d => { const g = groupOf(d.sd); let x = G.find(y => y.g === g); if (!x) G.push(x = {g, items: []}); x.items.push(d); });
    return G.map(x => '<div class="day"><b>'+x.g+'</b><span>'+x.items.length+'</span></div><div class="grid">'+x.items.map(thumb).join('')+'</div>').join('');
  }
  let ctx = [];
  function renderStats(){ const L = live(), useful = L.filter(d=>!d.noise).length; const on = Math.round(useful / Math.max(1,L.length) * 16); $('pbar').innerHTML = Array.from({length:16},(_,k)=>'<i class="'+(k<on?'on':'')+'" style="background-position:'+(k*100/15)+'% 0"></i>').join(''); $('stats').innerHTML = '<div><b>'+useful+'</b><span>упорядковано</span></div><div><b>'+upcoming().length+'</b><span>нагадувань</span></div><div><b>'+ALBUMS.filter((a,i)=>albumItems(i).length).length+'</b><span>альбомів</span></div>'; }
  function renderGallery(){ ctx = live(); $('gallery').innerHTML = groups(ctx); $('allcount').textContent = ctx.length; $('count').textContent = ctx.length+' '+pl(ctx.length,'скриншот','скриншоти','скриншотів'); }
  $('gallery').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openV(b.dataset.id, ctx); });

  /* прибирання */
  const outdated = () => live().filter(d => !d.noise && isPast(d)).sort((a,b) => b.ed - a.ed);
  const noiseLive = () => live().filter(d => d.noise);
  const why = d => isPromo(d) ? 'промокод діяв до ' + dm(d.ed) : 'подія вже минула';
  let pick = new Set(), lastRemoved = [];
  function renderTidyCard(){
    const n = outdated().length + noiseLive().length;
    $('tidy').innerHTML = n ? '<button type="button" class="tidy glass" id="tidyopen"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2.5l-4 9M6 12h12l-1.5 9.5h-9z" fill="none" stroke="#e2639f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx"><b>Можна прибрати '+n+' '+pl(n,'скриншот','скриншоти','скриншотів')+'</b><small>минулі події, старі промокоди й шум</small></span>'+chev+'</button>' : '';
    const b = $('tidyopen'); if (b) b.addEventListener('click', () => { pick = new Set([...outdated(), ...noiseLive()].map(d => d.id)); renderTidy(); push('tidy'); });
  }
  function pickRow(d, sub){ return '<button type="button" class="item" data-p="'+d.id+'"><span class="pick'+(pick.has(d.id)?' on':'')+'"><svg width="11" height="9" viewBox="0 0 12 10"><path d="M1.5 5.2 4.6 8.2 10.5 1.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+IMG(d.id)+'<span class="tx"><span class="t1">'+esc(d.title)+'</span><span class="t2">'+esc(sub)+'</span></span></button>'; }
  function renderTidy(){
    const o = outdated(), n = noiseLive();
    $('tidylist').innerHTML = (o.length ? '<div class="group">Вже неактуальні</div><div class="list glass">'+o.map(d => pickRow(d, why(d))).join('')+'</div>' : '') + (n.length ? '<div class="group">Меми, дублікати й випадкові знімки</div><div class="list glass">'+n.map(d => pickRow(d, d.noise)).join('')+'</div>' : '');
    const k = pick.size; $('tidydo').disabled = !k; $('tidydo').textContent = k ? 'Прибрати '+k+' '+pl(k,'скриншот','скриншоти','скриншотів') : 'Нічого не вибрано';
  }
  $('tidylist').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; const id = b.dataset.p; pick.has(id) ? pick.delete(id) : pick.add(id); renderTidy(); });
  let tt;
  $('tidydo').addEventListener('click', () => {
    lastRemoved = [...pick]; lastRemoved.forEach(id => removed.add(id)); stack = []; show('home'); renderAll();
    $('toast-t').textContent = 'Прибрано: '+lastRemoved.length; $('toast').hidden = false; clearTimeout(tt); tt = setTimeout(() => $('toast').hidden = true, 5000);
  });
  $('toast-u').addEventListener('click', () => { lastRemoved.forEach(id => removed.delete(id)); lastRemoved = []; $('toast').hidden = true; renderAll(); });

  /* пошук на екрані */
  let lastP = null, rctx = [];
  function run(){
    const q = $('q').value.trim(); $('clear').hidden = !q;
    if (!q){ $('home').hidden = false; $('results').hidden = true; $('sugg').hidden = false; lastP = null; return; }
    const {list, P} = search(q); lastP = P; rctx = list;
    $('home').hidden = true; $('results').hidden = false;
    if (!list.length){ $('rmeta').textContent = ''; $('rlist').innerHTML = '<div class="empty"><b>Нічого не знайшлося</b>Спробуйте описати інакше: що було на скриншоті, де це або коли.</div>'; return; }
    $('rmeta').textContent = list.length === 1 ? 'Знайшовся 1 скриншот' : 'Знайшлося '+list.length+' '+pl(list.length,'скриншот','скриншоти','скриншотів');
    $('rlist').innerHTML = list.map(d => '<button type="button" class="res" data-id="'+d.id+'">'+IMG(d.id)+'<span style="flex:1;min-width:0"><span class="rt">'+hl(d.title,P)+'</span><span class="rs">'+hl(d.text,P,14)+'</span><span class="rm">'+esc(dm(d.sd))+(d.ed && !isPast(d) ? ' · <b>'+esc(rel(d.ed))+'</b>' : '')+'</span></span></button>').join('');
  }
  let tmr; $('q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(run, 110); });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('q').blur(); } });
  $('clear').addEventListener('click', e => { e.preventDefault(); $('q').value = ''; run(); $('q').focus(); });
  $('rlist').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) openV(b.dataset.id, rctx); });
  window.addEventListener('scroll', () => $('sbar').classList.toggle('stuck', window.scrollY > 120), {passive:true});

  /* перегляд */
  let vl = [], vi = 0, lastF = null;
  function openV(id, list){ lastF = document.activeElement; vl = list.length ? list : DATA; vi = Math.max(0, vl.findIndex(d => d.id === id)); $('viewer').hidden = false; document.body.style.overflow = 'hidden'; showV(); $('vclose').focus({preventScroll:true}); }
  function closeV(){ $('viewer').hidden = true; document.body.style.overflow = ''; if (lastF) lastF.focus({preventScroll:true}); }
  function showV(){
    const d = vl[vi];
    const vi_ = $('vimg'); vi_.removeAttribute('data-fb'); vi_.dataset.id = d.id; vi_.setAttribute('data-full',''); vi_.src = d.id+'.jpg'; vi_.alt = d.title;
    $('vpos').textContent = (vi+1)+' з '+vl.length;
    $('vprev').disabled = vi === 0; $('vnext').disabled = vi === vl.length-1;
    let h = '<h3 id="vt">'+esc(d.title)+'</h3><div class="when">Збережено '+esc(dm(d.sd))+' о '+hm(d.sd)+'</div>';
    if (d.noise) h += '<div class="note">Фільтр вирішив, що тут нічого корисного: '+esc(d.noise.charAt(0).toLowerCase()+d.noise.slice(1))+'. У пошук не потрапляє.</div>';
    else {
      if (d.ed && !isPast(d)) h += '<div class="remind"><span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a6.5 6.5 0 0 0-6.5 6.5v4.3L3.5 17h17l-2-3.7V9A6.5 6.5 0 0 0 12 2.5zM9.3 19a2.8 2.8 0 0 0 5.4 0z" fill="currentColor"/></svg></span><span>Нагадаю <b>'+esc(rel(d.ed))+'</b></span></div>';
      else if (d.ed && isPast(d)) h += '<div class="note">'+esc(why(d).charAt(0).toUpperCase()+why(d).slice(1))+'. Можна прибрати.</div>';
      if (d.keys && d.keys.length) h += '<div class="kv">'+d.keys.map(k => '<div><span>'+esc(k[0])+'</span><span>'+esc(k[1])+'</span></div>').join('')+'</div>';
      h += '<button type="button" class="ocrt" id="ocrt">Показати текст зі скриншота</button><div class="ocr" id="ocr" hidden>'+(lastP ? hl(d.text, lastP) : esc(d.text))+'</div>';
    }
    if (['u02','u11'].includes(d.id)) h += '<div class="note">Особисті дані на цьому скриншоті приховано.</div>';
    $('vinfo').innerHTML = h;
    const t = $('ocrt'); if (t) t.addEventListener('click', () => { const o = $('ocr'); o.hidden = !o.hidden; t.textContent = o.hidden ? 'Показати текст зі скриншота' : 'Сховати текст'; });
    $('viewer').scrollTop = 0;
  }
  $('vclose').addEventListener('click', closeV);
  $('vprev').addEventListener('click', () => { if (vi > 0){ vi--; showV(); } });
  $('vnext').addEventListener('click', () => { if (vi < vl.length-1){ vi++; showV(); } });
  document.addEventListener('keydown', e => { if ($('viewer').hidden) return; if (e.key === 'Escape') closeV(); if (e.key === 'ArrowLeft') $('vprev').click(); if (e.key === 'ArrowRight') $('vnext').click(); });
  let tx = null, ty = null;
  $('vimgw').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  $('vimgw').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) (dx > 0 ? $('vprev') : $('vnext')).click(); });

  function renderAll(){ renderStats(); renderTidyCard(); renderSoon(); renderAlbums(); renderGallery(); renderRem(); if ($('q').value.trim()) run(); }
  renderAll();
})();
</script>
</body>
</html>
